<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospital Appointment System</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Segoe UI, Arial, sans-serif; margin: 0; background: #f2f6fa; color: #1f2d3d; }
  header { background: #0b6e99; color: #fff; padding: 16px 24px; }
  header h1 { margin: 0; font-size: 22px; }
  main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  h2 { margin-top: 0; font-size: 18px; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: flex; flex-direction: column; font-size: 13px; gap: 4px; }
  input, select, textarea { padding: 8px; border: 1px solid #c5d0db; border-radius: 6px; font-size: 14px; }
  .full { grid-column: 1 / -1; }
  button { background: #0b6e99; color: #fff; border: 0; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button:hover { background: #095a7d; }
  button.danger { background: #c0392b; padding: 6px 10px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px; border-bottom: 1px solid #e3e9ef; text-align: left; }
  th { background: #eaf2f8; }
  .Booked { color: #1e8449; font-weight: 600; }
  .Cancelled { color: #c0392b; font-weight: 600; }
  #msg { margin-bottom: 12px; font-weight: 600; }
  @media (max-width: 600px) { form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><h1>🏥 Hospital Appointment System</h1></header>
<main>
  <div id="msg"></div>

  <section class="card">
    <h2>Book an Appointment</h2>
    <form id="bookForm">
      <label>Patient Name <input id="pname" required></label>
      <label>Phone <input id="pphone" required pattern="[0-9]{10}" title="10-digit phone number"></label>
      <label>Age <input id="page" type="number" min="0" max="120"></label>
      <label>Doctor <select id="doctor" required></select></label>
      <label>Date <input id="date" type="date" required></label>
      <label>Time <input id="time" type="time" required></label>
      <label class="full">Reason <textarea id="reason" rows="2"></textarea></label>
      <div class="full"><button type="submit">Book Appointment</button></div>
    </form>
  </section>

  <section class="card">
    <h2>Appointments</h2>
    <table>
      <thead>
        <tr><th>#</th><th>Patient</th><th>Doctor</th><th>Dept</th><th>Date</th><th>Time</th><th>Status</th><th></th></tr>
      </thead>
      <tbody id="apptBody"></tbody>
    </table>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script>
// Same SQL as schema.sql (embedded so the page works without a server)
const SCHEMA = `
CREATE TABLE IF NOT EXISTS doctors (
  doctor_id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL, department TEXT NOT NULL);
CREATE TABLE IF NOT EXISTS patients (
  patient_id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL, phone TEXT NOT NULL, age INTEGER);
CREATE TABLE IF NOT EXISTS appointments (
  appointment_id INTEGER PRIMARY KEY AUTOINCREMENT,
  patient_id INTEGER NOT NULL REFERENCES patients(patient_id),
  doctor_id  INTEGER NOT NULL REFERENCES doctors(doctor_id),
  appt_date TEXT NOT NULL, appt_time TEXT NOT NULL, reason TEXT,
  status TEXT NOT NULL DEFAULT 'Booked',
  UNIQUE (doctor_id, appt_date, appt_time));
`;
const SEED = `
INSERT INTO doctors (name, department) VALUES
 ('Dr. Anitha Rao','Cardiology'),('Dr. Karthik Kumar','Orthopedics'),
 ('Dr. Meena Iyer','Pediatrics'),('Dr. Suresh Babu','General Medicine');
`;

let db;
const $ = id => document.getElementById(id);

function save() {                       // persist DB in the browser
  const bin = db.export();
  let s = ""; bin.forEach(b => s += String.fromCharCode(b));
  localStorage.setItem("hospital_db", btoa(s));
}
function load() {
  const s = localStorage.getItem("hospital_db");
  if (!s) return null;
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
}
function rows(sql, params = []) {
  const st = db.prepare(sql); st.bind(params);
  const out = []; while (st.step()) out.push(st.getAsObject());
  st.free(); return out;
}
function show(text, ok = true) {
  $("msg").style.color = ok ? "#1e8449" : "#c0392b";
  $("msg").textContent = text;
}

function renderDoctors() {
  $("doctor").innerHTML = rows("SELECT * FROM doctors")
    .map(d => `<option value="${d.doctor_id}">${d.name} (${d.department})</option>`).join("");
}
function renderAppointments() {
  const data = rows(`
    SELECT a.appointment_id, p.name AS patient, d.name AS doctor, d.department,
           a.appt_date, a.appt_time, a.status
    FROM appointments a
    JOIN patients p ON p.patient_id = a.patient_id
    JOIN doctors  d ON d.doctor_id  = a.doctor_id
    ORDER BY a.appt_date, a.appt_time`);
  $("apptBody").innerHTML = data.length ? data.map(r => `
    <tr>
      <td>${r.appointment_id}</td><td>${r.patient}</td><td>${r.doctor}</td>
      <td>${r.department}</td><td>${r.appt_date}</td><td>${r.appt_time}</td>
      <td class="${r.status}">${r.status}</td>
      <td>${r.status === "Booked"
        ? `<button class="danger" onclick="cancelAppt(${r.appointment_id})">Cancel</button>` : ""}</td>
    </tr>`).join("") : `<tr><td colspan="8">No appointments yet.</td></tr>`;
}

function cancelAppt(id) {
  db.run("UPDATE appointments SET status='Cancelled' WHERE appointment_id=?", [id]);
  save(); renderAppointments(); show("Appointment cancelled.");
}

$("bookForm").addEventListener("submit", e => {
  e.preventDefault();
  try {
    const doctor = +$("doctor").value, date = $("date").value, time = $("time").value;
    const clash = rows(`SELECT 1 FROM appointments
      WHERE doctor_id=? AND appt_date=? AND appt_time=? AND status='Booked'`, [doctor, date, time]);
    if (clash.length) return show("That slot is already booked for this doctor.", false);

    // free a cancelled slot so the UNIQUE constraint doesn't block rebooking
    db.run(`DELETE FROM appointments WHERE doctor_id=? AND appt_date=? AND appt_time=? AND status='Cancelled'`,
           [doctor, date, time]);

    db.run("INSERT INTO patients (name, phone, age) VALUES (?,?,?)",
           [$("pname").value.trim(), $("pphone").value, $("page").value || null]);
    const pid = rows("SELECT last_insert_rowid() AS id")[0].id;
    db.run(`INSERT INTO appointments (patient_id, doctor_id, appt_date, appt_time, reason)
            VALUES (?,?,?,?,?)`, [pid, doctor, date, time, $("reason").value]);
    save(); renderAppointments(); e.target.reset();
    show("Appointment booked successfully!");
  } catch (err) { show("Error: " + err.message, false); }
});

initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}` })
  .then(SQL => {
    const saved = load();
    db = saved ? new SQL.Database(saved) : new SQL.Database();
    if (!saved) { db.run(SCHEMA); db.run(SEED); save(); }
    $("date").min = new Date().toISOString().split("T")[0];
    renderDoctors(); renderAppointments();
  });
</script>
</body>
</html>
