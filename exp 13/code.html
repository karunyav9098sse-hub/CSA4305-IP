DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flower &amp; Gift Shop Manager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<style>
  :root{--bg:#fdf5f6;--panel:#fff;--ink:#2b2230;--muted:#76687a;--line:#ecdde0;--brand:#b83a64;--brand-d:#8f2a4c;--leaf:#2f5d43;--ok:#237a4b;--warn:#b7791f;--bad:#b42318}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--leaf);color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  header h1{margin:0;font-size:1.3rem}
  header button{background:transparent;color:#fff;border:1px solid #ffffff77;padding:6px 12px;border-radius:6px;cursor:pointer}
  nav{display:flex;gap:4px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
  nav button{background:none;border:none;padding:14px 16px;font-size:.95rem;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent}
  nav button.active{color:var(--brand);border-color:var(--brand);font-weight:600}
  main{padding:24px 28px;max-width:1100px;margin:auto}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .stat b{display:block;font-size:1.5rem}
  .stat span{color:var(--muted);font-size:.85rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:18px}
  .card h2{margin:0 0 12px;font-size:1.05rem}
  form,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
  .full{grid-column:1/-1}
  label{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  input,select,textarea{padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit}
  .btn{background:var(--brand);color:#fff;border:none;padding:9px 14px;border-radius:6px;cursor:pointer;font:inherit}
  .btn:hover{background:var(--brand-d)}
  .btn.alt{background:var(--leaf)}
  .btn.sm{padding:4px 8px;font-size:.8rem}
  .btn.red{background:var(--bad)}
  .wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:.9rem}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:#faeef0;font-weight:600}
  .tag{padding:2px 8px;border-radius:99px;font-size:.78rem;background:#eee}
  .Delivered{background:#dcf3e6;color:var(--ok)}
  .Pending{background:#fdf0d5;color:var(--warn)}
  .Packed{background:#e3ecfb;color:#2b5bb5}
  .Cancelled{background:#fbe0dd;color:var(--bad)}
  .low{color:var(--bad);font-weight:600}
  textarea{width:100%;min-height:90px;font-family:Consolas,monospace}
  .err{color:var(--bad);margin-top:8px}
  section{display:none}section.show{display:block}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>Flower &amp; Gift Shop Manager</h1>
  <button id="reset">Reset sample data</button>
</header>
<nav id="tabs"></nav>
<main>
  <section id="dashboard"></section>
  <section id="orders"></section>
  <section id="products"></section>
  <section id="customers"></section>
  <section id="sql"></section>
</main>

<script>
/* ---------- Schema + sample data (same as schema.sql) ---------- */
const SCHEMA = `
CREATE TABLE customers (customer_id INTEGER PRIMARY KEY AUTOINCREMENT, full_name TEXT NOT NULL, phone TEXT, email TEXT UNIQUE, city TEXT);
CREATE TABLE products (product_id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL, category TEXT NOT NULL, price REAL NOT NULL CHECK (price > 0), stock INTEGER NOT NULL DEFAULT 0 CHECK (stock >= 0));
CREATE TABLE orders (order_id INTEGER PRIMARY KEY AUTOINCREMENT, customer_id INTEGER NOT NULL, order_date TEXT DEFAULT CURRENT_DATE, delivery_date TEXT NOT NULL, address TEXT NOT NULL, card_message TEXT, total REAL NOT NULL, status TEXT DEFAULT 'Pending', FOREIGN KEY (customer_id) REFERENCES customers(customer_id));
CREATE TABLE order_items (item_id INTEGER PRIMARY KEY AUTOINCREMENT, order_id INTEGER NOT NULL, product_id INTEGER NOT NULL, qty INTEGER NOT NULL CHECK (qty > 0), unit_price REAL NOT NULL, FOREIGN KEY (order_id) REFERENCES orders(order_id), FOREIGN KEY (product_id) REFERENCES products(product_id));
INSERT INTO customers (full_name,phone,email,city) VALUES ('Meena Sundar','9876501234','meena@example.com','Chennai'),('Rahul Verma','9123409876','rahul@example.com','Avadi'),('Divya Nair','9988001122','divya@example.com','Coimbatore');
INSERT INTO products (name,category,price,stock) VALUES ('Red Rose Bouquet (12)','Bouquet',699,20),('Mixed Seasonal Bouquet','Bouquet',899,12),('Single Red Rose','Single Flower',60,100),('Sunflower Bunch (5)','Bouquet',450,4),('Chocolate Gift Hamper','Gift Hamper',1299,8),('Dairy Milk Silk Box','Chocolates',350,30),('Jade Plant in Pot','Plants',399,15),('Teddy Bear (Medium)','Soft Toys',549,3);
INSERT INTO orders (customer_id,order_date,delivery_date,address,card_message,total,status) VALUES (1,'2026-11-20','2026-11-27','12 Lake View Road, Chennai','Happy Anniversary!',1048,'Pending'),(2,'2026-11-18','2026-11-22','45 Main Street, Avadi','Get well soon',1299,'Delivered'),(3,'2026-11-24','2026-11-26','8 Gandhi Nagar, Coimbatore','Happy Birthday Divya',1248,'Packed');
INSERT INTO order_items (order_id,product_id,qty,unit_price) VALUES (1,1,1,699),(1,6,1,350),(2,5,1,1299),(3,2,1,899),(3,6,1,350);
`;

let db, SQL;
const KEY = "flower_shop_db_v1";
const LOW_STOCK = 5;
const CATEGORIES = ["Bouquet","Single Flower","Gift Hamper","Chocolates","Plants","Soft Toys"];
const $ = id => document.getElementById(id);
const inr = n => "₹" + Number(n).toLocaleString("en-IN");
const today = () => new Date().toISOString().slice(0, 10);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function rows(sql, params = []) {
  const stmt = db.prepare(sql); stmt.bind(params);
  const out = [];
  while (stmt.step()) out.push(stmt.getAsObject());
  stmt.free(); return out;
}
function run(sql, params = []) { db.run(sql, params); save(); }
function save() {
  try {
    const bytes = db.export(); let bin = "";
    bytes.forEach(b => bin += String.fromCharCode(b));
    localStorage.setItem(KEY, btoa(bin));
  } catch (e) { console.warn("Could not save", e); }
}
function load() {
  try {
    const s = localStorage.getItem(KEY); if (!s) return null;
    const bin = atob(s), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new SQL.Database(arr);
  } catch { return null; }
}
function table(cols, data, actions) {
  if (!data.length) return "<p>No records yet.</p>";
  return `<div class="wrap"><table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}${actions ? "<th></th>" : ""}</tr></thead><tbody>` +
    data.map(r => `<tr>${cols.map(c => {
      const v = r[c];
      if (c === "status") return `<td><span class="tag ${esc(v)}">${esc(v)}</span></td>`;
      if (c === "stock") return `<td class="${v <= LOW_STOCK ? "low" : ""}">${esc(v)}</td>`;
      if (["price","total","unit_price","revenue"].includes(c)) return `<td>${inr(v)}</td>`;
      return `<td>${esc(v)}</td>`;
    }).join("")}${actions ? `<td>${actions(r)}</td>` : ""}</tr>`).join("") + "</tbody></table></div>";
}

/* ---------- Dashboard ---------- */
function renderDashboard() {
  const one = q => Object.values(rows(q)[0])[0];
  $("dashboard").innerHTML = `
  <div class="stats">
    <div class="stat"><b>${one("SELECT COUNT(*) FROM orders")}</b><span>Total orders</span></div>
    <div class="stat"><b>${inr(one("SELECT IFNULL(SUM(total),0) FROM orders WHERE status!='Cancelled'"))}</b><span>Revenue</span></div>
    <div class="stat"><b>${one("SELECT COUNT(*) FROM orders WHERE status IN ('Pending','Packed')")}</b><span>Open deliveries</span></div>
    <div class="stat"><b>${one(`SELECT COUNT(*) FROM products WHERE stock <= ${LOW_STOCK}`)}</b><span>Low-stock items</span></div>
  </div>
  <div class="card"><h2>Deliveries due in the next 7 days</h2>
  ${table(["order_id","full_name","delivery_date","address","status"], rows("SELECT o.order_id, c.full_name, o.delivery_date, o.address, o.status FROM orders o JOIN customers c ON c.customer_id=o.customer_id WHERE o.status IN ('Pending','Packed') AND date(o.delivery_date) BETWEEN date('now') AND date('now','+7 day') ORDER BY o.delivery_date"))}</div>
  <div class="card"><h2>Best sellers</h2>
  ${table(["name","sold","revenue"], rows("SELECT p.name, SUM(oi.qty) AS sold, SUM(oi.qty*oi.unit_price) AS revenue FROM order_items oi JOIN products p ON p.product_id=oi.product_id JOIN orders o ON o.order_id=oi.order_id WHERE o.status!='Cancelled' GROUP BY p.product_id ORDER BY sold DESC LIMIT 5"))}</div>
  <div class="card"><h2>Low stock</h2>
  ${table(["name","category","stock"], rows(`SELECT name, category, stock FROM products WHERE stock <= ${LOW_STOCK} ORDER BY stock`))}</div>`;
}

/* ---------- Orders (with cart) ---------- */
let cart = [];

function renderOrders() {
  const custs = rows("SELECT customer_id, full_name FROM customers ORDER BY full_name");
  const prods = rows("SELECT product_id, name, price, stock FROM products WHERE stock > 0 ORDER BY name");
  $("orders").innerHTML = `
  <div class="card"><h2>New order</h2>
  <form id="fOrd">
    <label>Customer<select name="c" required>${custs.map(c => `<option value="${c.customer_id}">${esc(c.full_name)}</option>`).join("")}</select></label>
    <label>Delivery date<input name="d" type="date" min="${today()}" required></label>
    <label class="full">Delivery address<input name="a" required></label>
    <label class="full">Card message<input name="m" placeholder="Happy Birthday!"></label>
    <label>Product<select id="pSel">${prods.map(p => `<option value="${p.product_id}">${esc(p.name)} · ${inr(p.price)} (${p.stock} in stock)</option>`).join("")}</select></label>
    <label>Quantity<input id="pQty" type="number" min="1" value="1"></label>
    <button type="button" class="btn alt" id="addItem">Add to order</button>
    <div class="full" id="cartBox"></div>
    <button class="btn full">Place order</button>
  </form><div class="err" id="eOrd"></div></div>
  <div class="card"><h2>All orders</h2>
  ${table(["order_id","full_name","items","delivery_date","total","status"],
    rows(`SELECT o.order_id, c.full_name,
          (SELECT GROUP_CONCAT(p.name || ' x' || oi.qty, ', ') FROM order_items oi JOIN products p ON p.product_id=oi.product_id WHERE oi.order_id=o.order_id) AS items,
          o.delivery_date, o.total, o.status
          FROM orders o JOIN customers c ON c.customer_id=o.customer_id ORDER BY o.order_id DESC`),
    r => {
      let b = "";
      if (r.status === "Pending") b += `<button class="btn sm" data-st="Packed:${r.order_id}">Mark packed</button> `;
      if (r.status === "Packed") b += `<button class="btn sm alt" data-st="Delivered:${r.order_id}">Mark delivered</button> `;
      if (r.status === "Pending" || r.status === "Packed") b += `<button class="btn sm red" data-cancel="${r.order_id}">Cancel</button>`;
      return b;
    })}</div>`;

  drawCart();

  $("addItem").onclick = () => {
    $("eOrd").textContent = "";
    const p = prods.find(x => x.product_id == $("pSel").value);
    const qty = parseInt($("pQty").value, 10);
    if (!p || !qty || qty < 1) { $("eOrd").textContent = "Choose a product and a quantity of at least 1."; return; }
    const existing = cart.find(x => x.product_id === p.product_id);
    const newQty = (existing ? existing.qty : 0) + qty;
    if (newQty > p.stock) { $("eOrd").textContent = `Only ${p.stock} of "${p.name}" in stock.`; return; }
    if (existing) existing.qty = newQty; else cart.push({ product_id: p.product_id, name: p.name, price: p.price, qty });
    drawCart();
  };

  $("fOrd").onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    if (!cart.length) { $("eOrd").textContent = "Add at least one item to the order."; return; }
    try {
      for (const it of cart) {
        const st = rows("SELECT stock FROM products WHERE product_id=?", [it.product_id])[0].stock;
        if (it.qty > st) throw new Error(`Not enough stock for "${it.name}".`);
      }
      const total = cart.reduce((s, it) => s + it.qty * it.price, 0);
      db.run("BEGIN");
      db.run("INSERT INTO orders (customer_id, delivery_date, address, card_message, total) VALUES (?,?,?,?,?)",
        [f.get("c"), f.get("d"), f.get("a"), f.get("m"), total]);
      const id = rows("SELECT last_insert_rowid() AS id")[0].id;
      cart.forEach(it => {
        db.run("INSERT INTO order_items (order_id, product_id, qty, unit_price) VALUES (?,?,?,?)", [id, it.product_id, it.qty, it.price]);
        db.run("UPDATE products SET stock = stock - ? WHERE product_id = ?", [it.qty, it.product_id]);
      });
      db.run("COMMIT"); save();
      cart = []; refresh();
    } catch (x) {
      try { db.run("ROLLBACK"); } catch {}
      $("eOrd").textContent = "Could not place order: " + x.message;
    }
  };
}

function drawCart() {
  const box = $("cartBox"); if (!box) return;
  if (!cart.length) { box.innerHTML = "<p>The order is empty. Choose a product and select Add to order.</p>"; return; }
  const total = cart.reduce((s, it) => s + it.qty * it.price, 0);
  box.innerHTML = `<div class="wrap"><table><thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Subtotal</th><th></th></tr></thead><tbody>` +
    cart.map((it, i) => `<tr><td>${esc(it.name)}</td><td>${it.qty}</td><td>${inr(it.price)}</td><td>${inr(it.qty * it.price)}</td><td><button type="button" class="btn sm red" data-rm="${i}">Remove</button></td></tr>`).join("") +
    `<tr><th colspan="3">Total</th><th colspan="2">${inr(total)}</th></tr></tbody></table></div>`;
}

/* ---------- Products ---------- */
function renderProducts() {
  $("products").innerHTML = `
  <div class="card"><h2>Add product</h2>
  <form id="fProd">
    <label>Name<input name="n" required></label>
    <label>Category<select name="c">${CATEGORIES.map(c => `<option>${c}</option>`).join("")}</select></label>
    <label>Price (₹)<input name="p" type="number" min="1" step="0.01" required></label>
    <label>Opening stock<input name="s" type="number" min="0" value="10" required></label>
    <button class="btn">Add product</button>
  </form><div class="err" id="eProd"></div></div>
  <div class="card"><h2>Catalogue and stock</h2>
  ${table(["product_id","name","category","price","stock"], rows("SELECT product_id,name,category,price,stock FROM products ORDER BY product_id DESC"),
    r => `<button class="btn sm alt" data-restock="${r.product_id}">+10 stock</button> <button class="btn sm red" data-delprod="${r.product_id}">Delete</button>`)}</div>`;
  $("fProd").onsubmit = e => { e.preventDefault(); const f = new FormData(e.target);
    try { run("INSERT INTO products (name,category,price,stock) VALUES (?,?,?,?)", [f.get("n"), f.get("c"), f.get("p"), f.get("s")]); refresh(); }
    catch (x) { $("eProd").textContent = "Could not add product: " + x.message; } };
}

/* ---------- Customers ---------- */
function renderCustomers() {
  $("customers").innerHTML = `
  <div class="card"><h2>Add customer</h2>
  <form id="fCust">
    <label>Full name<input name="n" required></label>
    <label>Phone<input name="p"></label>
    <label>Email<input name="e" type="email"></label>
    <label>City<input name="c"></label>
    <button class="btn">Add customer</button>
  </form><div class="err" id="eCust"></div></div>
  <div class="card"><h2>All customers</h2>
  ${table(["customer_id","full_name","phone","email","city"], rows("SELECT customer_id,full_name,phone,email,city FROM customers ORDER BY customer_id DESC"),
    r => `<button class="btn sm red" data-delcust="${r.customer_id}">Delete</button>`)}</div>`;
  $("fCust").onsubmit = e => { e.preventDefault(); const f = new FormData(e.target);
    try { run("INSERT INTO customers (full_name,phone,email,city) VALUES (?,?,?,?)", [f.get("n"), f.get("p"), f.get("e") || null, f.get("c")]); refresh(); }
    catch (x) { $("eCust").textContent = "Could not add customer: " + x.message; } };
}

/* ---------- SQL console ---------- */
function renderSql() {
  $("sql").innerHTML = `
  <div class="card"><h2>Run your own SQL</h2>
  <textarea id="q">SELECT category, COUNT(*) AS products, SUM(stock) AS units_in_stock
FROM products GROUP BY category;</textarea>
  <p><button class="btn" id="runq">Run query</button></p>
  <div class="err" id="eq"></div><div id="qout"></div></div>`;
  $("runq").onclick = () => {
    $("eq").textContent = ""; $("qout").innerHTML = "";
    try {
      const res = db.exec($("q").value);
      if (!res.length) { $("qout").innerHTML = "<p>Query ran. No rows returned.</p>"; save(); return; }
      res.forEach(r => $("qout").innerHTML += table(r.columns, r.values.map(v => Object.fromEntries(r.columns.map((c, i) => [c, v[i]])))));
      save();
    } catch (x) { $("eq").textContent = "SQL error: " + x.message; }
  };
}

/* ---------- App wiring ---------- */
const TABS = ["dashboard","orders","products","customers","sql"];
const LABEL = {dashboard:"Dashboard",orders:"Orders",products:"Products & stock",customers:"Customers",sql:"SQL console"};
const RENDER = {dashboard:renderDashboard,orders:renderOrders,products:renderProducts,customers:renderCustomers,sql:renderSql};
let current = "dashboard";

function show(tab) {
  current = tab;
  TABS.forEach(t => $(t).classList.toggle("show", t === tab));
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  RENDER[tab]();
}
function refresh() { show(current); }

document.addEventListener("click", e => {
  const d = e.target.dataset;
  try {
    if (d.rm !== undefined) { cart.splice(Number(d.rm), 1); drawCart(); }
    if (d.st) { const [s, id] = d.st.split(":"); run("UPDATE orders SET status=? WHERE order_id=?", [s, id]); refresh(); }
    if (d.cancel) {
      if (!confirm("Cancel this order and return the items to stock?")) return;
      rows("SELECT product_id, qty FROM order_items WHERE order_id=?", [d.cancel])
        .forEach(it => db.run("UPDATE products SET stock = stock + ? WHERE product_id = ?", [it.qty, it.product_id]));
      run("UPDATE orders SET status='Cancelled' WHERE order_id=?", [d.cancel]); refresh();
    }
    if (d.restock) { run("UPDATE products SET stock = stock + 10 WHERE product_id=?", [d.restock]); refresh(); }
    if (d.delprod) { run("DELETE FROM products WHERE product_id=?", [d.delprod]); refresh(); }
    if (d.delcust) { run("DELETE FROM customers WHERE customer_id=?", [d.delcust]); refresh(); }
  } catch (x) { alert("Could not complete that action: " + x.message + "\n(Records used in orders cannot be deleted.)"); }
});

$("tabs").innerHTML = TABS.map(t => `<button data-tab="${t}">${LABEL[t]}</button>`).join("");
$("tabs").onclick = e => { if (e.target.dataset.tab) show(e.target.dataset.tab); };
$("reset").onclick = () => {
  if (!confirm("This replaces all data with the sample data. Continue?")) return;
  db = new SQL.Database(); db.run("PRAGMA foreign_keys = ON;"); db.run(SCHEMA); cart = []; save(); refresh();
};

initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}` }).then(S => {
  SQL = S;
  db = load();
  if (!db) { db = new SQL.Database(); db.run(SCHEMA); save(); }
  db.run("PRAGMA foreign_keys = ON;");
  show("dashboard");
}).catch(() => {
  document.body.insertAdjacentHTML("beforeend", "<p class='err' style='padding:20px'>Could not load the SQL engine. Check your internet connection and reload.</p>");
});
</script>
</body>
</html>
